{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>:root { --primary: {{ cliente.color_principal }}; }</style>
</head>
<body class="bg-[#0a0a0a] text-white flex items-center justify-center min-h-screen">
    <div class="text-center p-8 glass-card rounded-[40px] border border-white/10 bg-white/5">
        <div class="text-6xl mb-6">✅</div>
        <h1 class="text-4xl font-bold mb-4 italic">¡Reserva Confirmada!</h1>
        <p class="text-white/60 mb-8">Hola {{ reserva.nombre_contacto }}, tu cita con <strong>{{ cliente.nombre }}</strong> ha sido agendada en Google Calendar.</p>
        <a href="/c/{{ cliente.slug }}/" class="bg-white text-black px-8 py-3 rounded-full font-bold hover:bg-[var(--primary)] hover:text-white transition-all">
            Volver al inicio
        </a>
    </div>
</body>
</html>
