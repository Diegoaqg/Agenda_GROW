{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Reservas | {{ cliente.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>

    :root {
        --primary: {{ cliente.color_principal|default:'#00ff88' }};
        --bg-overlay: rgba(10, 10, 10, 0.7); 
        --text-white: #ffffff;
        --border-color: rgba(255, 255, 255, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                    url("{{ cliente.imagen_fondo.url }}") no-repeat center center fixed;
        background-size: cover;
        color: var(--text-white);
        font-family: 'Poppins', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px 0;
    }

    .main-wrapper {
        width: 95%;
        max-width: 1800px;
        z-index: 1;
    }

    #calendar {
        background: rgba(255, 255, 255, 0.05) !important; 
        backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px);
        border-radius: 30px;
        padding: 25px;
        border: 1px solid var(--border-color);
        width: 100%;
        height: 85vh !important; 
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .fc-daygrid-day-frame {
        position: relative !important;
        overflow: hidden;
    }
    /* Evitar que el calendario se estreche al usar Flexbox */
    .fc-daygrid-body, .fc-scrollgrid-sync-table, .fc-col-header {
        width: 100% !important;
    }

    /* ================================================================
    2. SEGMENTACIÓN DE CELDAS (REGLAS ESPECÍFICAS)
    ================================================================ */

    /* --- MES ANTERIOR --- */
    .cell-prev-month {
        background: rgba(0, 0, 0, 0.85) !important; /* Celdas oscuras */
        pointer-events: none !important; /* Anuladas del todo */
        cursor: default !important;
    }
    .cell-prev-month .fc-daygrid-day-number { 
        display: none !important; 
    }

    /* --- FIN DE SEMANAS --- */
    .cell-weekend {
        pointer-events: none !important; /* Sin efecto click/hover */
    }
    .cell-weekend .fc-daygrid-day-number {
        color: white !important;
        opacity: 0.15 !important; /* Número opaco */
    }

    /* --- MES SIGUIENTE --- */
    .cell-next-month {
        background: rgba(255, 255, 255, 0.02) !important;
        opacity: 0.4; /* Celdas más apagadas */
        transition: all 0.3s ease;
    }
    .cell-next-month:hover {
        opacity: 0.8; /* Efecto hover leve */
        background: rgba(255, 255, 255, 0.08) !important;
        cursor: pointer;
    }

    /* --- BLOQUEOS (DÍAS CERCANOS Y FILMMAKER NO DISPONIBLE) --- */
    .cell-restricted {
        background: rgba(0, 0, 0, 0.5) !important; /* Opacar celda completa */
        pointer-events: none !important;
        position: relative;
    }

    /* Centrado de mensajes sin romper el layout */
    .lock-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        background: rgba(0, 0, 0, 0.4);
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        white-space: nowrap;
        z-index: 10;
    }

    .lock-message.urgent {
        color: #ff4444;
        border-color: rgba(255, 68, 68, 0.3);
    }

    /* ================================================================
    3. ESTILOS DE INTERFAZ (HEADERS, BOTONES, NÚMEROS)
    ================================================================ */

    /* Hover para celdas normales (Disponibles) */
    .fc-daygrid-day:not([class*="cell-"]):hover {
        background: rgba(255, 255, 255, 0.1) !important;
        cursor: pointer;
    }

    .fc-daygrid-day:not([class*="cell-"]):hover .fc-daygrid-day-number {
        color: var(--primary) !important;
        transform: scale(1.1);
    }

    /* Hoy */
    .fc-day-today {
        background: rgba(255, 255, 255, 0.08) !important;
    }
    .fc-day-today .fc-daygrid-day-number {
        background: var(--primary) !important;
        color: #000 !important;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 8px;
        font-weight: bold;
    }

    /* Estética de la cuadrícula */
    .fc-theme-standard td, .fc-theme-standard th { 
        border: 1px solid rgba(255,255,255,0.08) !important; 
    }

    .fc-col-header-cell-cushion { 
        color: var(--primary) !important; 
        text-transform: uppercase; 
        font-size: 0.8rem; 
        font-weight: 600;
        text-decoration: none !important; 
    }

    .fc-daygrid-day-number { 
        position: relative !important;
        z-index: 2 !important;
        color: white !important; 
        text-decoration: none !important; 
        padding: 12px !important; 
        transition: all 0.2s ease;
    }

    /* Botones de navegación */
    .fc-button-primary {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 12px !important;
        padding: 8px 16px !important;
    }
    .fc-button-primary:hover { 
        background: var(--primary) !important; 
        color: #000 !important; 
    }

    /* Ocultar elementos innecesarios */
    .fc-daygrid-event { display: none !important; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="flex justify-between items-center px-6 py-2 bg-black/20 backdrop-blur-md rounded-2xl border border-white/5">
            <div class="flex items-center gap-4">
                <img src="{{ cliente.logo.url }}" class="h-10 drop-shadow-lg">
                <h1 class="text-xl font-light">Agendar con <span class="font-bold">{{ cliente.nombre }}</span></h1>
            </div>
            <div class="text-sm text-white/60 font-medium uppercase tracking-widest">Vista Mensual</div>
        </div>

        <div id="calendar"></div>
    </div>

    <div id="modal-reserva" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-[#1a1a1a] border border-white/10 p-8 rounded-[30px] w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold mb-2 text-white">Confirmar Cita</h3>
            <p id="fecha-texto" class="text-[var(--primary)] mb-6 font-medium uppercase text-sm tracking-wider"></p>
            
            <form method="POST" action="{% url 'confirmar_reserva' cliente.slug %}" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="fecha_hora" id="input-fecha">
                <input type="hidden" name="servicio" value="{{ request.GET.servicio }}">
                <input type="hidden" name="tipo" value="{{ request.GET.tipo }}">
                
                <input type="text" name="nombre_contacto" placeholder="Tu nombre" required 
                    class="w-full p-4 bg-white/5 border border-white/10 rounded-xl text-white focus:border-[var(--primary)] outline-none transition-all">
                
                <input type="email" name="email" placeholder="Tu correo electrónico" required 
                    class="w-full p-4 bg-white/5 border border-white/10 rounded-xl text-white focus:border-[var(--primary)] outline-none transition-all">
                
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="cerrarModal()" class="flex-1 py-4 text-white/40 hover:text-white font-bold transition-all">Cancelar</button>
                    <button type="submit" class="flex-1 bg-white text-black py-4 rounded-xl font-bold hover:bg-[var(--primary)] hover:text-white transition-all">
                        Agendar Ahora
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const MAX_FILMMAKERS = 2; // Límite de clases por día

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'es',
            firstDay: 1,
            fixedWeekCount: false,
            height: '100%',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: ''
            },
            // Vinculación con tus eventos de Google
            events: "{% url 'api_eventos_google' cliente.slug %}",

            // 1. ASIGNACIÓN DE CLASES Y MENSAJES
            dayCellDidMount: function(info) {
                const date = info.date;
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                
                const currentMonth = calendar.getDate().getMonth();
                const cellMonth = date.getMonth();
                const dayOfWeek = date.getDay();

                // REGLA 1: MES ANTERIOR (O DÍAS PASADOS DEL MES ACTUAL)
                if (date < now || cellMonth < currentMonth) {
                    info.el.classList.add('cell-prev-month');
                    return; // Prioridad máxima: si es pasado, no evaluamos más
                }

                // REGLA 2: FIN DE SEMANAS
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    info.el.classList.add('cell-weekend');
                    return;
                }

                // REGLA 3: MES SIGUIENTE
                if (cellMonth > currentMonth) {
                    info.el.classList.add('cell-next-month');
                    // Nota: El comportamiento de click se maneja en dateClick
                    return;
                }

                // REGLA 4: DÍAS MUY CERCANOS (Margen de 3 días)
                const margen3Dias = new Date(now);
                margen3Dias.setDate(now.getDate() + 3);

                if (date >= now && date < margen3Dias) {
                    info.el.classList.add('cell-restricted');
                    const msg = document.createElement('div');
                    msg.className = 'lock-message';
                    msg.innerText = 'Mín. 3 días';
                    info.el.appendChild(msg);
                    
                    return;
                }

                // REGLA 5: FILMMAKER NO DISPONIBLE (Límite alcanzado)
                const eventosHoy = calendar.getEvents().filter(e => 
                    e.startStr.split('T')[0] === date.toISOString().split('T')[0]
                );

                if (eventosHoy.length >= MAX_FILMMAKERS) {
                    info.el.classList.add('cell-restricted');
                    const msg = document.createElement('div');
                    msg.className = 'lock-message urgent';
                    msg.innerText = 'Lleno';
                    info.el.appendChild(msg);
                }
            },

            // 2. GESTIÓN DE CLICKS Y NAVEGACIÓN
            dateClick: function(info) {
                const now = new Date();
                const ultimoDiaMes = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                
                // Validación: ¿Estamos en la última semana del mes presente?
                const esUltimaSemana = (ultimoDiaMes.getDate() - now.getDate()) <= 7;

                // Comportamiento para celdas del MES SIGUIENTE
                if (info.dayEl.classList.contains('cell-next-month')) {
                    if (esUltimaSemana) {
                        calendar.next(); // Pasa al mes siguiente
                    } else {
                        // Opcional: Podrías poner un aviso discreto aquí
                        console.log("Acceso al mes siguiente aún bloqueado");
                    }
                    return;
                }

                // Bloqueo total para el resto de categorías restringidas
                if (info.dayEl.classList.contains('cell-prev-month') || 
                    info.dayEl.classList.contains('cell-weekend') || 
                    info.dayEl.classList.contains('cell-restricted')) {
                    return;
                }

                // Si pasa todas las validaciones, procedemos con la reserva
                abrirFormularioReserva(info.dateStr);
            }
        });

        calendar.render();
    });

    // --- FUNCIONES DE MODAL (ORIGINALES) ---
    function abrirFormularioReserva(fechaISO) {
        const modal = document.getElementById('modal-reserva');
        document.getElementById('input-fecha').value = fechaISO + "T09:00:00";
        
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const fechaLegible = new Date(fechaISO + "T00:00:00").toLocaleDateString('es-ES', opciones);
        
        document.getElementById('fecha-texto').innerText = fechaLegible;
        modal.style.display = 'flex';
        modal.classList.remove('hidden');
    }

    function cerrarModal() {
        const modal = document.getElementById('modal-reserva');
        modal.style.display = 'none';
        modal.classList.add('hidden');
    }
    </script>
</body>
</html>
